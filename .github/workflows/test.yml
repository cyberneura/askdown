# The checks a pull request gets, and the gate a release will stand behind.
#
# `workflow_call` is here so that a release workflow can `uses:` this one and
# hold its build back with a plain `needs:` (the called jobs land in the
# caller's run). A separate workflow started by the same push could not do that.
#
# Policy: https://github.com/cyberneura/cyberneura-github-actions/blob/main/docs/build-requires-tests.md
name: Test

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # askdown is the window; there is no build without Tauri, so every platform
  # needs its webview toolkit. Linux gets webkit2gtk from apt.
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Tauri dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Pinned to a SHA on master rather than a generated branch like `stable`:
      # those commits are collected once the branch moves on, and the run then
      # fails before Rust is even installed.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust (cargo + target)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Formatting does not vary by platform, so one leg answers for both.
      - name: Format
        if: matrix.platform == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --locked: what is tested has to be what is built, and a stale Cargo.lock
      # would quietly resolve to something else.
      - name: Test
        run: cargo test --workspace --locked
