[package]
name = "askdown"
description = "Opens a window that asks the questions written in a Markdown file and writes the answers back"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "askdown"
path = "src/main.rs"

[dependencies]
askdown-core.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
tauri = "2"
base64 = "0.22"
# Opens links in the system browser. The opener plugin would do the same through
# `open`, with a permission system this app does not use.
open = "5"
percent-encoding = "2"

[build-dependencies]
tauri-build = "2"

# AppKit access for the bare executable's Dock icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
