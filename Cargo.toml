[workspace]
members = ["crates/askdown-core", "crates/askdown-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cyberneura/askdown"

[workspace.dependencies]
# The version is here for crates.io: a path dependency with no version cannot be
# published.
askdown-core = { path = "crates/askdown-core", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
